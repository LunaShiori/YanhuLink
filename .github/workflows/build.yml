name: Build & Release

# 触发：推送 tag（如 v2.2.0）或手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # ↓ 改版本号时同步修改这里和 installer/setup.iss 中的 MyAppVersion
  APP_VERSION: '2.3.0'

# 显式声明工作流权限。
# 默认 GITHUB_TOKEN 只有只读权限，会导致 action-gh-release 报
# 「Resource not accessible by integration」(403) 无法创建 Release。
# 这里显式授予 contents: write（最小必要权限，不需要去改仓库的全局设置）。
permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore src/CampusNetLogin/CampusNetLogin.csproj -p:Platform=x64

      # 发布「自包含」产物。
      # 关键：必须同时满足
      #   1) --self-contained true        → 自带 .NET 运行时
      #   2) -p:WindowsAppSDKSelfContained=true → 自带 Windows App Runtime
      #   3) 不要用 PublishSingleFile     → 单文件会破坏 WinUI 的 Runtime 解析，
      #      导致用户机器上弹「This application requires the Windows App Runtime」
      - name: 发布自包含版（绿色版基础）
        run: >
          dotnet publish src/CampusNetLogin/CampusNetLogin.csproj
          -c Release -r win-x64 -p:Platform=x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o publish/win-x64

      - name: 精简卫星语言包（仅保留中英）
        shell: pwsh
        run: |
          Get-ChildItem publish/win-x64 -Directory |
            Where-Object { $_.Name -match '^[a-z]{2,3}(-[A-Za-z]+)?$' } |
            Where-Object { $_.Name -notin @('zh-CN','zh-TW','en-US') } |
            Remove-Item -Recurse -Force
          Remove-Item publish/win-x64/*.pdb -Force -ErrorAction SilentlyContinue

      - name: 准备绿色版附加文件
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination publish/win-x64/ -Force

      - name: 打包绿色版 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* `
            -DestinationPath "YanhuLink-v$env:APP_VERSION-win-x64-portable.zip"

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      # Inno Setup 官方不内置中文语言包，CI 上需要先补进去，
      # 否则 setup.iss 的 [Languages] 会报 "Couldn't open include file"
      - name: 安装简体中文语言包
        shell: pwsh
        run: |
          $dir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://cdn.jsdelivr.net/gh/jrsoftware/issrc@is-7_1_0/Files/Languages/ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile "$dir\ChineseSimplified.isl" -UseBasicParsing
          Write-Host "已下载语言包: $((Get-Item "$dir\ChineseSimplified.isl").Length) 字节"

      - name: 生成安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: 计算校验和
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 先生成本工作流自己的两行
          $mine = @()
          $mine += (Get-FileHash "YanhuLink-v$env:APP_VERSION-win-x64-portable.zip" -Algorithm SHA256 |
                    ForEach-Object { "$($_.Hash)  YanhuLink-v$env:APP_VERSION-win-x64-portable.zip" })
          $mine += (Get-FileHash installer\Output\YanhuLink-Setup-x64.exe -Algorithm SHA256 |
                    ForEach-Object { "$($_.Hash)  YanhuLink-Setup-x64.exe" })

          # Android 工作流与本工作流并行，都会写 Release 上的 SHA256SUMS.txt。
          # 直接整体覆盖会把 Android 的行冲掉，所以先取回已有内容并合并。
          #
          # 注意：必须从 **Release 附件** 取，不能用
          #   /repos/{repo}/contents/SHA256SUMS.txt?ref={tag}
          # 后者读的是仓库里 **提交过的文件**，可能残留上一个版本的旧哈希，
          # 合并后会污染校验文件（此前 v2.3.0 就误带进了 v2.2.0 的行）。
          #
          # 并行竞态：谁先跑完谁先 upload，后跑的才看得到对方的行。
          # 本工作流跑得久，故在此**轮询等待** Android 的校验行出现
          # （最多约 4 分钟），拿到即合并；超时则退化为只含 Windows 两行，
          # 不会让步骤失败。
          # 把任意换行（LF / CRLF）切成行，并丢掉空行与不含哈希的噪声行
          function Get-SumLines([string]$body, [string[]]$allowed) {
            if ([string]::IsNullOrEmpty($body)) { return @() }
            @($body -split "`r?`n" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^[0-9a-fA-F]{64}\s+\S+$' } |
              Where-Object { $n = ($_ -split '\s+')[-1]; $allowed -contains $n })
          }

          $prev = @()
          $releaseNames = @()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $deadline = (Get-Date).AddMinutes(4)
            do {
              try {
                $rel = Invoke-RestMethod `
                  -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
                  -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -ErrorAction Stop
                $releaseNames = @($rel.assets | ForEach-Object { $_.name })
                $sumAsset = $rel.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' } | Select-Object -First 1
                if ($sumAsset) {
                  $text = Invoke-RestMethod -Uri $sumAsset.url `
                            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" } `
                            -ErrorAction Stop
                  $body = if ($text -is [byte[]]) { [Text.Encoding]::UTF8.GetString($text) } else { [string]$text }
                  # 只保留「文件名确实存在于本次 Release」的行，避免旧版本残留
                  $prev = Get-SumLines $body $releaseNames
                }
                # 已经拿到 Android 的行就不必再等
                if ($prev | Where-Object { $_ -match 'android\.apk' }) { break }
              } catch { $prev = @() }
              if ((Get-Date) -ge $deadline) { break }
              Start-Sleep -Seconds 15
            } while ($true)
          }

          # 去掉与本次重复的行（按文件名去重），再做合并
          $myNames = $mine | ForEach-Object { ($_ -split '\s+')[-1] }
          $kept = $prev | Where-Object { $n = ($_ -split '\s+')[-1]; $myNames -notcontains $n }

          # 用 LF 逐行写出：避免 Windows 端 CRLF 与 Android 端 LF 混用
          $all = @($kept + $mine)
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'SHA256SUMS.txt'),
            (($all -join "`n") + "`n"),
            (New-Object Text.UTF8Encoding $false))
          Get-Content SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YanhuLink-win-x64
          path: |
            YanhuLink-v*-win-x64-portable.zip
            installer/Output/*.exe
            SHA256SUMS.txt

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YanhuLink-v*-win-x64-portable.zip
            installer/Output/*.exe
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          # 重复推送同一个 tag 时覆盖已有附件，而不是报错
          overwrite_files: true
