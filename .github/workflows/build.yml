name: Build & Release

# 触发：推送 tag（如 v2.2.0）或手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # ↓ 改版本号时同步修改这里和 installer/setup.iss 中的 MyAppVersion
  APP_VERSION: '2.3.3'

# 显式声明工作流权限。
# 默认 GITHUB_TOKEN 只有只读权限，会导致 action-gh-release 报
# 「Resource not accessible by integration」(403) 无法创建 Release。
# 这里显式授予 contents: write（最小必要权限，不需要去改仓库的全局设置）。
permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore src/CampusNetLogin/CampusNetLogin.csproj -p:Platform=x64

      # 发布「自包含」产物。
      # 关键：必须同时满足
      #   1) --self-contained true        → 自带 .NET 运行时
      #   2) -p:WindowsAppSDKSelfContained=true → 自带 Windows App Runtime
      #   3) 不要用 PublishSingleFile     → 单文件会破坏 WinUI 的 Runtime 解析，
      #      导致用户机器上弹「This application requires the Windows App Runtime」
      - name: 发布自包含版（绿色版基础）
        run: >
          dotnet publish src/CampusNetLogin/CampusNetLogin.csproj
          -c Release -r win-x64 -p:Platform=x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o publish/win-x64

      - name: 精简卫星语言包（仅保留中英）
        shell: pwsh
        run: |
          Get-ChildItem publish/win-x64 -Directory |
            Where-Object { $_.Name -match '^[a-z]{2,3}(-[A-Za-z]+)?$' } |
            Where-Object { $_.Name -notin @('zh-CN','zh-TW','en-US') } |
            Remove-Item -Recurse -Force
          Remove-Item publish/win-x64/*.pdb -Force -ErrorAction SilentlyContinue

      - name: 准备绿色版附加文件
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination publish/win-x64/ -Force

      - name: 打包绿色版 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/* `
            -DestinationPath "YanhuLink-v$env:APP_VERSION-win-x64-portable.zip"

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      # Inno Setup 官方不内置中文语言包，CI 上需要先补进去，
      # 否则 setup.iss 的 [Languages] 会报 "Couldn't open include file"
      - name: 安装简体中文语言包
        shell: pwsh
        run: |
          $dir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://cdn.jsdelivr.net/gh/jrsoftware/issrc@is-7_1_0/Files/Languages/ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile "$dir\ChineseSimplified.isl" -UseBasicParsing
          Write-Host "已下载语言包: $((Get-Item "$dir\ChineseSimplified.isl").Length) 字节"

      - name: 生成安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: 计算校验和
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 设计：SHA256SUMS.txt 只由本工作流独家写入，Android 工作流不再写它。
          # 单一写入方 → 不存在相互覆盖与并行竞态，也不会有换行/粘行问题。
          #
          # 本工作流自己产出的两个文件就地取哈希；
          # Android 的 APK 由对方上传到 Release，这里等它出现后下载并计算哈希。
          #
          # 注意：本步骤只在 tag 触发时需要完整三行；其他分支退化为本地两行。
          $lines = [System.Collections.Generic.List[string]]::new()

          $zipName = "YanhuLink-v$env:APP_VERSION-win-x64-portable.zip"
          $zipHash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          $lines.Add("$zipHash  $zipName")

          # 安装包文件名带版本号（与 installer/setup.iss 的 OutputBaseFilename 一致）
          $setupName = "YanhuLink-v$env:APP_VERSION-win-x64-setup.exe"
          $setupHash = (Get-FileHash "installer\Output\$setupName" -Algorithm SHA256).Hash
          $lines.Add("$setupHash  $setupName")

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $deadline = (Get-Date).AddMinutes(6)
            $apkAsset = $null
            do {
              try {
                $rel = Invoke-RestMethod `
                  -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" `
                  -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -ErrorAction Stop
                $apkAsset = $rel.assets | Where-Object { $_.name -like '*.apk' } | Select-Object -First 1
              } catch { $apkAsset = $null }
              if ($apkAsset) { break }
              if ((Get-Date) -ge $deadline) { break }
              Start-Sleep -Seconds 15
            } while ($true)

            if ($apkAsset) {
              $tmp = Join-Path $env:RUNNER_TEMP $apkAsset.name
              Invoke-WebRequest -Uri $apkAsset.url -OutFile $tmp `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" }
              $apkHash = (Get-FileHash $tmp -Algorithm SHA256).Hash
              $lines.Add("$apkHash  $($apkAsset.name)")
              Write-Host "APK 已取到并计算哈希: $($apkAsset.name)"
            } else {
              Write-Warning "等待 6 分钟仍未看到 APK 附件，本次只写 Windows 两行"
            }
          }

          # 统一以 LF 结尾逐行写出，避免 CRLF 与 LF 混用
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            (New-Object Text.UTF8Encoding $false))
          Write-Host "--- SHA256SUMS.txt ---"
          Get-Content SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YanhuLink-win-x64
          path: |
            YanhuLink-v*-win-x64-portable.zip
            installer/Output/*.exe
            SHA256SUMS.txt

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YanhuLink-v*-win-x64-portable.zip
            installer/Output/*.exe
            SHA256SUMS.txt
          # ★ 显式撰写更新详情。
          #   不用 generate_release_notes：GitHub 自动生成的只有一串 commit 标题，
          #   用户看到的是「修复 #12」这类无信息量的条目。
          #   这里直接写清楚「改了什么、影响谁、怎么用」，让下载页自己就能说清。
          #   每次发版前按实际改动修改本段内容。
          body: |
            ## 砚湖连 YanhuLink v${{ env.APP_VERSION }}

            扬州职业技术大学高邮湖校区校园网自动连接工具 —— 本版为**网络热备修复版**，
            修的是「切到备用网络后回不到校园网」这条链路上的一连串连锁问题。

            ### 本次修复与改进

            **电脑端 · 网络热备**

            - **修复「切到备用网络后，校园网就再也探不到了」** —— 这是本次最核心的问题。
              切换到备用网络靠的是调整网卡优先级：备用网卡调高、校园网网卡压低。
              但网卡优先级影响的不只是上网流量，**连发往校园网内部地址（认证服务器）的包
              也会被一起交给手机热点** —— 手机当然不认识学校内网地址，包直接被丢掉。
              由此产生三个后果：

              - 界面上校园网探测一直是「超时 / 丢包」，看起来像校园网又坏了；
              - **打不开校园网认证页面**，想手动登录都做不到；
              - 校园网早就恢复了，程序却完全察觉不到。

              现在切换成功后，程序会给认证服务器等内网地址单独加一条
              「只走网线」的精准路由（`/32` 主机路由，**优先级高于任何默认路由**）：

              - 备用网络照常承担上网流量，校园网这条链路仍然可以正常访问与探测；
              - 切换期间**仍能打开校园网认证页面**；
              - 探测结果从此真实可信，界面上不再出现误导性的「校园网丢包」。

            - **修复「校园网恢复正常后无法自动切回」** —— 承接上一条：
              既然探测不到校园网，就永远等不到「恢复」的信号，只能一直停在备用网络里。
              而且备用期间的恢复判定用错了维度 —— 它把「公网出口是否通畅」也算了进来，
              而备用期间公网走的是手机热点，**热点自己抖一下就会让判定变成「校园网没恢复」**。
              现在恢复判定只看校园网这条链路本身；另外，如果因为权限或网络环境
              加不了精准路由，程序还会**定期主动「探回」确认**，保证任何情况下都能回到校园网。

            - **切回校园网后自动重新认证** —— 校园网认证按设备 IP 绑定，
              切走再切回、IP 变了，原登录状态必然失效。以前会出现
              「网络切回来了，网页却还是打不开」；现在切回后会自动补一次登录。

            - **修复「切回来又被切走」的来回横跳** —— 切回校园网的那一刻认证还没重建，
              会被误判成出口故障而立刻再切走，形成十几秒一轮的反复横跳，
              比老实停在备用网络里更难受。现在切回后有一段时间的宽限期，
              这类抖动不会再触发切换。

            **安卓端**

            - 版本号更新至 1.0.2（功能与 1.0.1 一致，仅跟进版本节奏）。

            ### 下载

            | 文件 | 说明 |
            | --- | --- |
            | `YanhuLink-v${{ env.APP_VERSION }}-win-x64-setup.exe` | **推荐**：Windows 安装包，含桌面快捷方式与卸载项 |
            | `YanhuLink-v${{ env.APP_VERSION }}-win-x64-portable.zip` | Windows 绿色版：解压即用，无需安装 |
            | `YanhuLink-v1.0.2-android.apk` | 安卓版（独立版本号，当前 1.0.2） |
            | `SHA256SUMS.txt` | 以上文件的 SHA-256 校验和 |

            > **系统要求**：Windows 10 1809（17763）及以上 / Windows 11，x64 架构。
            > 发布包已自带 .NET 运行时与 Windows App Runtime，**无需任何前置依赖**。
            >
            > 安卓端为调试签名包，部分机型需在系统设置中允许「安装未知来源应用」。
          draft: false
          prerelease: false
          # 重复推送同一个 tag 时覆盖已有附件，而不是报错
          overwrite_files: true
