name: Build Android APK

# 触发：推送 tag（如 v2.3.0）时与 Windows 构建并行；也可手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ANDROID_APP_VERSION: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Java 17 是 .NET Android（net8.0-android）要求的 JDK 版本
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 让本次运行的 dotnet 固定使用 8.0.x。
      # runner 预装的 .NET 10 SDK 会把 net8.0-android 判定为 EOL 并抛
      # NETSDK1202 错误，同时把 TargetPlatformVersion 推断成 21（触发 NU1202）。
      # csproj 里已锁 TargetPlatformVersion=34 并压制 NETSDK1202，
      # 但统一 SDK 版本能从根上避免这类"本机/CI 不一致"。
      - name: 固定 .NET SDK 版本
        shell: bash
        run: |
          dotnet --version
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          dotnet --list-sdks

      # Android workload 是构建 net8.0-android 的前置条件。
      # GitHub 的 ubuntu-latest runner 已预装 Android SDK，
      # 这里只需装上 workload 本体。
      - name: 安装 Android workload
        run: dotnet workload install android

      - name: 还原依赖
        run: dotnet restore src/YanhuLink.Android/YanhuLink.Android.csproj

      # 构建 Release APK。
      #
      # 关键点：
      #   · AndroidPackageFormat=apk  → 出 .apk 而不是 .aab
      #   · AndroidKeyStore=false     → 用自动生成的调试签名。
      #     校园网工具是内部小范围分发，不上架应用商店，
      #     调试签名能让用户直接安装（正式签名需要用户自备 keystore，
      #     那会增加「怎么签」的负担而收益很小）。
      #     注意：调试签名的 APK 在部分机型上需要用户手动允许
      #     「安装未知来源应用」。
      - name: 构建 APK
        run: >
          dotnet publish src/YanhuLink.Android/YanhuLink.Android.csproj
          -c Release
          -f net8.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false
          -p:AndroidEnableProfiledAot=false
          -p:RunAOTCompilation=false
          -o publish/android

      - name: 收集 APK 并重命名
        shell: bash
        run: |
          set -e
          echo "--- 构建产物 ---"
          find publish/android -name '*.apk' -type f | head -20
          mkdir -p out
          # 取最大那个 APK（多 ABI 包会比单 ABI 大）
          APK=$(find publish/android -name '*-Signed.apk' -type f -printf '%s %p\n' \
                | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$APK" ]; then
            APK=$(find publish/android -name '*.apk' -type f -printf '%s %p\n' \
                  | sort -rn | head -1 | cut -d' ' -f2-)
          fi
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          echo "选中: $APK"
          cp "$APK" "out/YanhuLink-v${{ env.ANDROID_APP_VERSION }}-android.apk"
          ls -la out/

      - name: 计算校验和
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          sha256sum "YanhuLink-v${{ env.ANDROID_APP_VERSION }}-android.apk" \
            > SHA256SUMS-Android.txt
          cat SHA256SUMS-Android.txt

          # Windows 工作流与本工作流并行运行，两边都会写 Release 的 SHA256SUMS.txt。
          # 各自只写自己的行会把对方覆盖掉，因此这里先取回已有内容，
          # 去掉可能与本次重复的行后再合并，保证校验文件里
          # 同时包含 Windows 与 Android 的产物哈希。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
                 -o /dev/null 2>/dev/null || true
            EXISTING=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/${{ github.repository }}/contents/SHA256SUMS.txt?ref=$TAG" 2>/dev/null || true)
            if echo "$EXISTING" | grep -qE '[0-9a-f]{64}'; then
              echo "$EXISTING" | grep -E '[0-9a-f]{64}' > merged.txt
              grep -v -f <(awk '{print $2}' SHA256SUMS-Android.txt) merged.txt > merged2.txt || true
              cat merged2.txt SHA256SUMS-Android.txt > SHA256SUMS.txt
            else
              cp SHA256SUMS-Android.txt SHA256SUMS.txt
            fi
          else
            cp SHA256SUMS-Android.txt SHA256SUMS.txt
          fi
          echo "--- 合并后的 SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YanhuLink-android
          path: |
            out/*.apk
            out/SHA256SUMS-Android.txt

      - name: 附加到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS-Android.txt
          # 与 Windows 工作流并行运行时，Release 可能已存在；
          # overwrite_files 保证重复上传不报错。
          overwrite_files: true
          draft: false
          prerelease: false
