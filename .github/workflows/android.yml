name: Build Android APK

# 触发：推送 tag（如 v2.3.0）时与 Windows 构建并行；也可手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ANDROID_APP_VERSION: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Java 17 是 .NET Android（net8.0-android）要求的 JDK 版本
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 让本次运行的 dotnet 固定使用 8.0.x。
      # runner 预装的 .NET 10 SDK 会把 net8.0-android 判定为 EOL 并抛
      # NETSDK1202 错误，同时把 TargetPlatformVersion 推断成 21（触发 NU1202）。
      # csproj 里已锁 TargetPlatformVersion=34 并压制 NETSDK1202，
      # 但统一 SDK 版本能从根上避免这类"本机/CI 不一致"。
      - name: 固定 .NET SDK 版本
        shell: bash
        run: |
          dotnet --version
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          dotnet --list-sdks

      # Android workload 是构建 net8.0-android 的前置条件。
      # GitHub 的 ubuntu-latest runner 已预装 Android SDK，
      # 这里只需装上 workload 本体。
      - name: 安装 Android workload
        run: dotnet workload install android

      - name: 还原依赖
        run: dotnet restore src/YanhuLink.Android/YanhuLink.Android.csproj

      # 构建 Release APK。
      #
      # 关键点：
      #   · AndroidPackageFormat=apk  → 出 .apk 而不是 .aab
      #   · AndroidKeyStore=false     → 用自动生成的调试签名。
      #     校园网工具是内部小范围分发，不上架应用商店，
      #     调试签名能让用户直接安装（正式签名需要用户自备 keystore，
      #     那会增加「怎么签」的负担而收益很小）。
      #     注意：调试签名的 APK 在部分机型上需要用户手动允许
      #     「安装未知来源应用」。
      - name: 构建 APK
        run: >
          dotnet publish src/YanhuLink.Android/YanhuLink.Android.csproj
          -c Release
          -f net8.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false
          -p:AndroidEnableProfiledAot=false
          -p:RunAOTCompilation=false
          -o publish/android

      - name: 收集 APK 并重命名
        shell: bash
        run: |
          set -e
          echo "--- 构建产物 ---"
          find publish/android -name '*.apk' -type f | head -20
          mkdir -p out
          # 取最大那个 APK（多 ABI 包会比单 ABI 大）
          APK=$(find publish/android -name '*-Signed.apk' -type f -printf '%s %p\n' \
                | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$APK" ]; then
            APK=$(find publish/android -name '*.apk' -type f -printf '%s %p\n' \
                  | sort -rn | head -1 | cut -d' ' -f2-)
          fi
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK 产物"
            exit 1
          fi
          echo "选中: $APK"
          cp "$APK" "out/YanhuLink-v${{ env.ANDROID_APP_VERSION }}-android.apk"
          ls -la out/

      - name: 计算校验和
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          sha256sum "YanhuLink-v${{ env.ANDROID_APP_VERSION }}-android.apk" \
            > SHA256SUMS-Android.txt
          cat SHA256SUMS-Android.txt

          # 先给出「只含 Android 一行」的兜底结果。
          # 下面与 Windows 工作流的合并属于「锦上添花」的 best-effort：
          # 任何一步失败都只影响行数，不能让整个 job 挂掉。
          cp SHA256SUMS-Android.txt SHA256SUMS.txt

          # Windows 工作流与本工作流并行，两边都会写 Release 的 SHA256SUMS.txt。
          # 各自只写自己的行会把对方覆盖掉，因此这里先把已有内容取回来合并。
          #
          # 注意：必须从 **Release 附件** 取，不能用
          #   /repos/{repo}/contents/SHA256SUMS.txt?ref={tag}
          # 后者读的是仓库里提交过的文件，可能残留上一版本的旧哈希
          # （v2.3.0 曾误带进 v2.2.0 的行）。合并时只保留
          # 「文件名确实在本次 Release 里」的行。
          #
          # 本段整体用 `set +e` 包裹：GitHub Actions 默认给 run 加了
          # `-e -o pipefail`，而 grep 在「无匹配」时返回 1 属于正常分支，
          # 不加保护会直接中断步骤（此前即因此失败）。
          set +e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            MINE_NAME="YanhuLink-v${{ env.ANDROID_APP_VERSION }}-android.apk"

            REL_JSON=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null)
            RELEASE_NAMES=$(printf '%s' "$REL_JSON" | grep -o '"name": *"[^"]*"' | sed 's/.*"name": *"//; s/"$//')
            ASSET_URL=$(printf '%s' "$REL_JSON" | tr '{},' '\n\n\n' \
                        | grep -o '"browser_download_url": *"[^"]*SHA256SUMS\.txt"' \
                        | head -1 | sed 's/.*"browser_download_url": *"//; s/"$//')

            echo "release assets:"; printf '%s\n' "$RELEASE_NAMES"
            echo "sums asset url: $ASSET_URL"

            if [ -n "$ASSET_URL" ]; then
              curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$ASSET_URL" -o existing.txt 2>/dev/null
              : > merged.txt
              if [ -s existing.txt ]; then
                while IFS= read -r line; do
                  echo "$line" | grep -qE '[0-9a-f]{64}' || continue
                  fname=$(echo "$line" | awk '{print $2}')
                  echo "$RELEASE_NAMES" | grep -Fxq "$fname" && echo "$line" >> merged.txt
                done < existing.txt
              fi
              # 去掉与本次 Android 同名的重复行，再与自己的行合并
              if [ -s merged.txt ]; then
                grep -v -F "$MINE_NAME" merged.txt > merged2.txt 2>/dev/null
                cat merged2.txt SHA256SUMS-Android.txt > SHA256SUMS.txt
              fi
            fi
          fi
          set -e

          echo "--- 最终 SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: YanhuLink-android
          path: |
            out/*.apk
            out/SHA256SUMS-Android.txt

      - name: 附加到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS-Android.txt
          # 与 Windows 工作流并行运行时，Release 可能已存在；
          # overwrite_files 保证重复上传不报错。
          overwrite_files: true
          draft: false
          prerelease: false
